{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Library Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=10">
    <script src="{% static 'js/api.js' %}?v=7"></script>
    <script src="{% static 'js/auth.js' %}?v=7"></script>
</head>

<body>
    {% include 'nav.html' %}

    <div class="page-container" style="display:flex; justify-content:center; width:100%;">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Welcome Back</h1>
                <p>Sign in to Amrita Central Library Portal</p>
            </div>
            <div id="login-alert" class="alert"></div>
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="username">Roll Number or Username</label>
                    <input type="text" id="username" class="form-control" required placeholder="e.g. CH.SC.U4CSE24108 or admin">
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div style="position:relative;">
                        <input type="password" id="password" class="form-control" required
                            placeholder="Enter your password">
                        <button type="button" onclick="togglePassword('password', this)"
                            style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text-muted); font-size: 0.75rem; font-weight: 600; cursor:pointer;">SHOW</button>
                    </div>
                </div>
                <div style="text-align: right; margin-top: 0.5rem; margin-bottom: 1rem;">
                    <a href="/forgot-password/"
                        style="font-size: 0.875rem; color: var(--primary); text-decoration: none;">Forgot your
                        password?</a>
                </div>

                <!-- Login Button -->
                <button type="submit" class="btn btn-primary"
                    style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">Sign In</button>

                <div style="display: flex; align-items: center; margin: 1.5rem 0;">
                    <div style="flex: 1; height: 1px; background: var(--border);"></div>
                    <span style="padding: 0 1rem; color: var(--text-muted); font-size: 0.875rem;">OR</span>
                    <div style="flex: 1; height: 1px; background: var(--border);"></div>
                </div>

                <a href="/login/barcode/" class="btn btn-outline"
                    style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.5rem; text-decoration: none; border-color: #6366f1; color: #6366f1;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 5v14"></path>
                        <path d="M21 5v14"></path>
                        <path d="M7 5v14"></path>
                        <path d="M12 5v14"></path>
                        <path d="M17 5v14"></path>
                    </svg>
                    Login with ID Card
                </a>
            </form>

            <div style="text-align: center; margin-top: 1.5rem;">
                <span style="color: var(--text-muted);">Don't have an account?</span>
                <a href="/signup/" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign up
                    here</a>
            </div>
        </div>
    </div>

    <!-- Forgot Password logic moved to /forgot-password/ -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('login-form');
            const alertBox = document.getElementById('login-alert');
            const submitBtn = loginForm.querySelector('button[type="submit"]');

            // Check if user arrived from successful signup
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('registered') === '1') {
                alertBox.textContent = 'Registration successful! Please sign in with your credentials.';
                alertBox.className = 'alert alert-success';
                alertBox.style.display = 'block';
            }

            // Only redirect if there is an active session and it is genuinely valid
            if (isAuthenticated()) {
                const token = sessionStorage.getItem('access_token');
                const role = getUserRole();
                fetch('/api/students/me/', {
                    headers: { 'Authorization': `Bearer ${token}` }
                }).then(res => {
                    if (res.ok) {
                        if (role === 'admin') window.location.href = '/admin-dashboard/';
                        else window.location.href = '/books/';
                    } else {
                        // Stale or invalid session - clear silently to allow fresh login
                        sessionStorage.removeItem('access_token');
                        sessionStorage.removeItem('refresh_token');
                        sessionStorage.removeItem('user_role');
                    }
                }).catch(() => {
                    sessionStorage.removeItem('access_token');
                    sessionStorage.removeItem('refresh_token');
                    sessionStorage.removeItem('user_role');
                });
            }

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                alertBox.style.display = 'none';

                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;

                if (!username) {
                    showToast('Please enter your roll number or username.', 'error');
                    return;
                }
                if (!password) {
                    showToast('Please enter your password.', 'error');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'Signing in...';

                try {
                    const resp = await fetch('/api/token/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });

                    let data = {};
                    try {
                        data = await resp.json();
                    } catch (parseErr) {
                        data = {};
                    }

                    if (!resp.ok) {
                        throw new Error(data.detail || 'Invalid username, roll number, or password.');
                    }

                    sessionStorage.setItem('access_token', data.access);
                    sessionStorage.setItem('refresh_token', data.refresh);

                    // Check role and redirect smoothly
                    const role = await checkAndStoreUserRole();
                    showToast('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        if (role === 'admin') {
                            window.location.href = '/admin-dashboard/';
                        } else {
                            window.location.href = '/books/';
                        }
                    }, 400);
                } catch (err) {
                    alertBox.textContent = err.message || 'Login failed.';
                    alertBox.className = 'alert alert-danger';
                    alertBox.style.display = 'block';
                    showToast(err.message || 'Login failed.', 'error');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign In';
                }
            });
        });

        function togglePassword(id, btn) {
            const input = document.getElementById(id);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = 'HIDE';
            } else {
                input.type = 'password';
                btn.textContent = 'SHOW';
            }
        }
    </script>
</body>

</html>
