<script>
    // Apply theme as early as possible to prevent flashing
    (function () {
        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark-mode');
            // If body is already parsed, add it there too for backward compatibility
            if (document.body) document.body.classList.add('dark-mode');
        }
    })();
</script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Theme Management
        const body = document.body;
        const darkModeToggle = document.getElementById('dark-mode-toggle');
        const sunIcon = document.getElementById('sun-icon');
        const moonIcon = document.getElementById('moon-icon');

        const applyTheme = (theme) => {
            if (theme === 'dark') {
                document.documentElement.classList.add('dark-mode');
                body.classList.add('dark-mode');
                if (sunIcon) sunIcon.style.display = 'block';
                if (moonIcon) moonIcon.style.display = 'none';
            } else {
                document.documentElement.classList.remove('dark-mode');
                body.classList.remove('dark-mode');
                if (sunIcon) sunIcon.style.display = 'none';
                if (moonIcon) moonIcon.style.display = 'block';
            }
        };

        // Initial Theme
        const savedTheme = localStorage.getItem('theme') || 'light';
        applyTheme(savedTheme);

        if (darkModeToggle) {
            darkModeToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                const currentTheme = body.classList.contains('dark-mode') ? 'dark' : 'light';
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                localStorage.setItem('theme', newTheme);
                applyTheme(newTheme);
            });
        }

        const role = sessionStorage.getItem('user_role');
        const token = sessionStorage.getItem('access_token');

        const sidebarLinks = document.getElementById('sidebar-links');
        const sidebarAuth = document.getElementById('sidebar-auth-container');
        const brandLink = document.getElementById('nav-brand-link');
        const userProfile = document.getElementById('topbar-user-profile');
        const roleBadge = document.getElementById('topbar-role');
        const topbarTitle = document.getElementById('topbar-page-title');

        // Mobile Sidebar Toggle
        const mobileToggle = document.getElementById('mobile-menu-toggle');
        const sidebar = document.getElementById('main-sidebar');
        if (mobileToggle) {
            mobileToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                sidebar.classList.toggle('open');
            });
        }

        // Close sidebar when clicking outside of it
        document.addEventListener('click', (e) => {
            if (sidebar && sidebar.classList.contains('open')) {
                if (!sidebar.contains(e.target) && (!mobileToggle || !mobileToggle.contains(e.target))) {
                    sidebar.classList.remove('open');
                }
            }
        });

        // Set Topbar Title based on document title
        topbarTitle.textContent = document.title.split('-')[0].trim();

        // Icons
        const iconDashboard = `<svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>`;
        const iconBooks = `<svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1zM21 18.5c-1.1-.35-2.3-.5-3.5-.5-1.7 0-4.15.65-5.5 1.5V8c1.35-.85 3.8-1.5 5.5-1.5 1.2 0 2.4.15 3.5.5v11.5z"/></svg>`;
        const iconBook = `<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path></svg>`;
        const iconRequests = `<svg class="nav-icon" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>`;
        const iconIssues = `<svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>`;
        const iconUsers = `<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>`;
        const iconBank = `<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>`;
        const iconLogout = `<svg class="nav-icon" viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>`;
        const iconQrCode = `<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>`;

        if (token && role === 'admin') {
            document.body.classList.remove('auth-layout');
            userProfile.style.display = 'flex';
            roleBadge.textContent = 'Administrator';
            brandLink.href = '/admin-dashboard/';
            const dropdownProfileLink = document.getElementById('pd-profile-link');
            if (dropdownProfileLink) dropdownProfileLink.style.display = 'none';
            sidebarLinks.innerHTML = `
                <a href="/admin-dashboard/" class="nav-item">${iconDashboard} Dashboard</a>
                <a href="/admin-books/" class="nav-item">${iconBook} Manage Books</a>
                <a href="/admin-requests/" class="nav-item">${iconRequests} Manage Requests</a>
                <a href="/admin-students/" class="nav-item">${iconUsers} Manage Students</a>
                <a href="/admin-fines/" class="nav-item">${iconBank} Fines & Returns</a>
                <a href="/admin-logs/" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg> Audit Logs</a>
            `;
            sidebarAuth.innerHTML = `<button class="btn btn-outline" style="width:100%" id="logout-btn">${iconLogout} Logout</button>`;

            // Fetch actual profile to replace hardcoded placeholders
            fetchAPI('students/me/').then(user => {
                document.getElementById('topbar-username').textContent = user.name;
                const formattedRole = user.role.split('_').map(word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase()).join(' ');
                document.getElementById('topbar-role').textContent = formattedRole;
            }).catch(e => console.error("Failed to fetch admin profile", e));

        } else if (token && role === 'student') {
            document.body.classList.remove('auth-layout');
            userProfile.style.display = 'flex';
            roleBadge.textContent = 'Student';
            brandLink.href = '/books/';
            sidebarLinks.innerHTML = `
                <a href="/books/" class="nav-item">${iconBooks} Browse Books</a>
                <a href="/scan/book/" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><rect x="7" y="7" width="3" height="3"></rect><rect x="14" y="7" width="3" height="3"></rect><rect x="7" y="14" width="3" height="3"></rect><rect x="14" y="14" width="3" height="3"></rect></svg> Scan Book</a>
                <a href="/scan/return/" class="nav-item">${iconQrCode} Scan Return</a>
                <a href="/my-requests/" class="nav-item">${iconRequests} My Requests</a>
                <a href="/my-issues/" class="nav-item">${iconIssues}  Issued Books</a>
                <a href="/fines/" class="nav-item">${iconBank} My Fines</a>
                <a href="/profile/" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg> My Profile</a>
            `;
            sidebarAuth.innerHTML = `<button class="btn btn-outline" style="width:100%" id="logout-btn">${iconLogout} Logout</button>`;

            // Fetch actual profile
            fetchAPI('students/me/').then(user => {
                document.getElementById('topbar-username').textContent = user.name;
                document.getElementById('topbar-role').textContent = 'Student';
            }).catch(e => console.error("Failed to fetch student profile", e));
        } else {
            document.body.classList.add('auth-layout'); // Hide sidebar and topbar
        }

        // Move page content into #main-content safely after DOM is ready
        function mountPageContent() {
            const pageContainer = document.querySelector('.page-container');
            const mainContent = document.getElementById('main-content');
            if (pageContainer && mainContent && pageContainer.parentElement !== mainContent) {
                mainContent.appendChild(pageContainer);
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', mountPageContent);
        } else {
            mountPageContent();
        }

        const logoutBtn = document.getElementById('logout-btn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', (e) => {
                e.preventDefault();
                if (typeof handleLogout === 'function') {
                    handleLogout();
                } else {
                    sessionStorage.removeItem('access_token');
                    sessionStorage.removeItem('refresh_token');
                    sessionStorage.removeItem('user_role');
                    window.location.href = '/';
                }
            });
        }

        // Profile Dropdown Toggle Logic
        const profileAvatar = document.getElementById('topbar-avatar');
        const profileDropdown = document.getElementById('profile-dropdown');
        const closeDropdownBtn = document.getElementById('pd-close-btn');
        const signoutBtn = document.getElementById('pd-signout-btn');
        const openEditModalBtn = document.getElementById('open-edit-profile-btn');

        if (profileAvatar && profileDropdown) {
            profileAvatar.addEventListener('click', (e) => {
                e.stopPropagation();
                // Close notifications if open
                const notifList = document.getElementById('notification-list');
                if (notifList) notifList.style.display = 'none';

                profileDropdown.style.display = profileDropdown.style.display === 'none' ? 'block' : 'none';
            });

            closeDropdownBtn.addEventListener('click', () => {
                profileDropdown.style.display = 'none';
            });

            document.addEventListener('click', (e) => {
                if (profileDropdown.style.display === 'block' && !profileDropdown.contains(e.target) && !profileAvatar.contains(e.target)) {
                    profileDropdown.style.display = 'none';
                }
            });
        }

        if (signoutBtn) {
            signoutBtn.addEventListener('click', (e) => {
                e.preventDefault();
                if (typeof handleLogout === 'function') {
                    handleLogout();
                } else {
                    sessionStorage.removeItem('access_token');
                    sessionStorage.removeItem('refresh_token');
                    sessionStorage.removeItem('user_role');
                    window.location.href = '/';
                }
            });
        }

        // Edit Profile Modal Logic
        if (openEditModalBtn) {
            openEditModalBtn.addEventListener('click', async () => {
                profileDropdown.style.display = 'none';

                // Fetch the latest profile data
                try {
                    const user = await fetchAPI('students/me/');
                    document.getElementById('edit-profile-id').value = user.id;
                    document.getElementById('edit-profile-roll').value = user.roll_no;
                    document.getElementById('edit-profile-name').value = user.name;
                    document.getElementById('edit-profile-email').value = user.email;
                    document.getElementById('edit-profile-dept').value = user.department;
                    document.getElementById('edit-profile-year').value = user.year || '';
                    document.getElementById('edit-profile-phone').value = user.phone || '';

                    const modal = document.getElementById('edit-profile-modal');
                    modal.classList.add('open');
                } catch (error) {
                    showToast('Failed to load profile details.', 'error');
                }
            });
        }

        const editProfileForm = document.getElementById('edit-profile-form');
        if (editProfileForm) {
            editProfileForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const studentId = document.getElementById('edit-profile-id').value;
                const name = document.getElementById('edit-profile-name').value;
                const email = document.getElementById('edit-profile-email').value;
                const department = document.getElementById('edit-profile-dept').value;
                const yearStr = document.getElementById('edit-profile-year').value;
                const phone = document.getElementById('edit-profile-phone').value;

                const payload = {
                    name,
                    email,
                    department,
                    year: yearStr ? parseInt(yearStr) : null,
                    phone,
                    // roll_no is disabled so we don't send it intentionally.
                };

                const alertBox = document.getElementById('edit-profile-alert');

                try {
                    const resp = await fetchAPI(`students/${studentId}/`, {
                        method: 'PATCH',
                        body: JSON.stringify(payload)
                    });

                    // Update UI gracefully
                    const updatedName = resp.name;
                    const updatedFirstName = updatedName.split(' ')[0];
                    let updatedInitials = '';
                    const parts = updatedName.split(' ').filter(n => n.trim().length > 0);
                    if (parts.length > 1) {
                        updatedInitials = (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
                    } else if (parts.length === 1) {
                        updatedInitials = parts[0].charAt(0).toUpperCase();
                    }
                    const updatedAvatarUrl = `https://ui-avatars.com/api/?name=${updatedInitials}&background=random&color=fff&size=128&font-size=0.35`;

                    document.getElementById('topbar-username').textContent = updatedName;
                    document.getElementById('pd-name').textContent = updatedFirstName;
                    document.getElementById('pd-email').textContent = resp.email;
                    document.getElementById('pd-avatar-img').src = updatedAvatarUrl;

                    const tbAvatar = document.getElementById('topbar-avatar');
                    tbAvatar.innerHTML = `<img src="${updatedAvatarUrl}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;

                    showToast('Profile updated successfully!', 'success');
                    closeEditProfileModal();

                    // Dispatch event for other pages (like profile.html) to refresh
                    window.dispatchEvent(new CustomEvent('profileUpdated', { detail: resp }));
                } catch (error) {
                    alertBox.style.display = 'block';
                    alertBox.className = 'alert alert-error';
                    alertBox.textContent = error.data?.detail || 'Failed to update profile. Email might be in use.';
                }
            });
        }

        window.closeEditProfileModal = function () {
            const modal = document.getElementById('edit-profile-modal');
            modal.classList.remove('open');
            document.getElementById('edit-profile-alert').style.display = 'none';
        }
        const currentPath = window.location.pathname;
        const links = sidebarLinks.querySelectorAll('a');
        links.forEach(link => {
            if (link.getAttribute('href') === currentPath) {
                link.classList.add('active');
            }
        });

        // Global fetch to load student info and initials
        if (token) {
            fetchAPI('students/me/').then(user => {
                if (user) {
                    const fullName = user.name;
                    const firstName = fullName.split(' ')[0];
                    let initials = '';
                    const nameParts = fullName.split(' ').filter(n => n.trim().length > 0);
                    if (nameParts.length > 1) {
                        initials = (nameParts[0].charAt(0) + nameParts[nameParts.length - 1].charAt(0)).toUpperCase();
                    } else if (nameParts.length === 1) {
                        initials = nameParts[0].charAt(0).toUpperCase();
                    }

                    const avatarUrl = `https://ui-avatars.com/api/?name=${initials}&background=random&color=fff&size=128&font-size=0.35`;

                    // Update Topbar
                    document.getElementById('topbar-username').textContent = fullName;
                    const topbarAvatar = document.getElementById('topbar-avatar');
                    topbarAvatar.innerHTML = `<img src="${avatarUrl}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
                    topbarAvatar.style.padding = '0';
                    topbarAvatar.style.background = 'transparent';
                    topbarAvatar.style.border = '1px solid var(--neutral-border)';

                    // Update Dropdown Default
                    document.getElementById('pd-name').textContent = firstName;
                    document.getElementById('pd-email').textContent = user.email;
                    document.getElementById('pd-avatar-img').src = avatarUrl;
                }
            }).catch(e => {
                // Fallback decode if fetch fails (e.g., admin role)
                try {
                    const payload = JSON.parse(atob(token.split('.')[1]));
                    document.getElementById('topbar-username').textContent = `User #${payload.user_id}`;
                } catch (err) {
                    document.getElementById('topbar-username').textContent = 'Library User';
                }
            });

            // LOAD NOTIFICATIONS
            try {
                const notifContainer = document.getElementById('notification-container');
                const notifBtn = document.getElementById('notification-btn');
                const notifBadge = document.getElementById('notification-badge');
                const notifList = document.getElementById('notification-list');

                if (notifContainer && notifBtn && notifList) {
                    notifContainer.style.display = 'block';

                    async function loadNotifications() {
                        try {
                            const notifs = await fetchAPI('notifications/');
                            const unread = notifs.filter(n => !n.is_read);

                            if (unread.length > 0) {
                                if (notifBadge) {
                                    notifBadge.textContent = unread.length;
                                    notifBadge.style.display = 'block';
                                }
                            } else {
                                if (notifBadge) notifBadge.style.display = 'none';
                            }

                            if (notifs.length === 0) {
                                notifList.innerHTML = `<div style="padding: 1rem; text-align: center; color: var(--text-muted);">No notifications</div>`;
                            } else {
                                notifList.innerHTML = notifs.map(n => `
                                    <div style="padding: 1rem; border-bottom: 1px solid var(--border-color); ${n.is_read ? 'opacity: 0.7;' : 'font-weight: 500;'}">
                                        <p style="margin: 0; font-size: 0.875rem;">${n.message}</p>
                                        ${!n.is_read ? `<button class="btn btn-outline" style="padding: 0.2rem 0.5rem; font-size: 0.7rem; margin-top: 0.5rem;" onclick="markNotifRead(${n.id})">Mark Read</button>` : ''}
                                    </div>
                                `).join('');
                            }
                        } catch (err) {
                            console.error("Failed to load notifications", err);
                        }
                    }

                    window.markNotifRead = async function (id) {
                        try {
                            await fetchAPI(`notifications/${id}/mark_read/`, { method: 'POST' });
                            loadNotifications();
                        } catch (err) {
                            console.error("Failed to mark read", err);
                        }
                    };

                    notifBtn.addEventListener('click', () => {
                        notifList.style.display = notifList.style.display === 'none' ? 'block' : 'none';
                    });

                    // Load on start
                    loadNotifications();

                    // Poll every 30 seconds
                    setInterval(loadNotifications, 30000);
                }
            } catch (error) {
                console.error("Error setting up notifications script:", error);
            }
        }
    });
</script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const token = sessionStorage.getItem('access_token');
        const container = document.getElementById('ai-assistant-container');

        if (token) {
            container.style.display = 'block';
        }

        const toggleBtn = document.getElementById('ai-assistant-toggle');
        const chatWindow = document.getElementById('ai-chat-window');
        const closeBtn = document.getElementById('ai-chat-close');
        const chatMessages = document.getElementById('ai-chat-messages');
        const chatInput = document.getElementById('ai-chat-input');
        const sendBtn = document.getElementById('ai-chat-send');

        let isWelcomeDone = false;

        toggleBtn.addEventListener('click', () => {
            chatWindow.style.display = chatWindow.style.display === 'none' ? 'flex' : 'none';
            if (chatWindow.style.display === 'flex') {
                chatInput.focus();
                if (!isWelcomeDone) {
                    showWelcomeMessage();
                    isWelcomeDone = true;
                }
            }
        });

        closeBtn.addEventListener('click', () => {
            chatWindow.style.display = 'none';
        });

        function showWelcomeMessage() {
            typeMessage("Hi there! 👋 I'm your AI Library Assistant. Ask me for book recommendations, search by author, or check what you currently have issued!");
        }

        window.sendQuickMessage = function (text) {
            chatInput.value = text;
            sendMessage();
        };

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            chatInput.value = '';

            const typingId = showTypingIndicator();

            try {
                const response = await fetchAPI('library-assistant/', {
                    method: 'POST',
                    body: JSON.stringify({ message: text })
                }, true); // silent = true to avoid global loader

                removeTypingIndicator(typingId);
                typeMessage(response.reply, response.books);
            } catch (error) {
                removeTypingIndicator(typingId);
                addMessage("I'm sorry, I'm having a little trouble connecting to the library right now. Please try again in a moment.", 'bot');
            }
        }

        function addMessage(text, sender, books = null) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.textContent = text;
            chatMessages.appendChild(msgDiv);

            if (books && books.length > 0) {
                const listDiv = document.createElement('div');
                listDiv.style.marginTop = '0.5rem';
                books.forEach(book => {
                    const item = document.createElement('div');
                    item.className = 'ai-book-item';
                    item.innerHTML = `
                        <div class="ai-book-title">${book.title || book.book}</div>
                        <div class="ai-book-meta">
                            ${book.author ? `by ${book.author}` : (book.student ? `student: ${book.student}` : '')} 
                            ${book.category ? `| ${book.category}` : ''}
                            ${book.borrow_count !== undefined ? `| ${book.borrow_count} borrows` : ''}
                        </div>
                    `;
                    item.onclick = () => {
                        if (book.id) window.location.href = `/books/?id=${book.id}`;
                    };
                    listDiv.appendChild(item);
                });
                chatMessages.appendChild(listDiv);
            }

            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function typeMessage(text, books = null) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message bot';
            chatMessages.appendChild(msgDiv);

            let i = 0;
            const speed = 20; // ms per char

            function type() {
                if (i < text.length) {
                    msgDiv.textContent += text.charAt(i);
                    i++;
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                    setTimeout(type, speed);
                } else if (books) {
                    addBooksToList(books);
                }
            }
            type();
        }

        function addBooksToList(books) {
            const listDiv = document.createElement('div');
            listDiv.style.marginTop = '0.5rem';
            books.forEach(book => {
                const item = document.createElement('div');
                item.className = 'ai-book-item';
                item.innerHTML = `
                    <div class="ai-book-title">${book.title || book.book}</div>
                    <div class="ai-book-meta">
                        ${book.author ? `by ${book.author}` : (book.student ? `student: ${book.student}` : '')} 
                        ${book.category ? `| ${book.category}` : ''}
                    </div>
                `;
                item.onclick = () => {
                    if (book.id) window.location.href = `/books/?id=${book.id}`;
                };
                listDiv.appendChild(item);
            });
            chatMessages.appendChild(listDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showTypingIndicator() {
            const id = 'typing-' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = 'typing-indicator';
            div.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return id;
        }

        function removeTypingIndicator(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    });
</script>
