{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Library Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=10">
    <script src="{% static 'js/api.js' %}?v=7"></script>
    <script src="{% static 'js/auth.js' %}?v=7"></script>
</head>

<body>
    {% include 'nav.html' %}

    <div class="page-container" style="display:flex; justify-content:center; width:100%;">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Reset Password</h1>
                <p>Provide your username to securely set a new password</p>
            </div>

            <div id="reset-alert" class="alert" style="display: none;"></div>

            <form id="forgot-password-form">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" class="form-control" required placeholder="Enter your username">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">New Password</label>
                    <div style="position:relative;">
                        <input type="password" id="password" class="form-control" required
                            placeholder="Enter new password">
                        <button type="button" onclick="togglePassword('password', this)"
                            style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text-muted); font-size: 0.75rem; font-weight: 600; cursor:pointer;">SHOW</button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirm_password">Confirm New Password</label>
                    <div style="position:relative;">
                        <input type="password" id="confirm_password" class="form-control" required
                            placeholder="Confirm new password">
                        <button type="button" onclick="togglePassword('confirm_password', this)"
                            style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text-muted); font-size: 0.75rem; font-weight: 600; cursor:pointer;">SHOW</button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary"
                    style="width: 100%; margin-top: 1rem; padding: 0.75rem;">Set New Password</button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem;">
                <span style="color: var(--text-muted);">Remembered your password?</span>
                <a href="/" style="color: var(--primary); font-weight: 600; text-decoration: none;">Return to Login</a>
            </div>
        </div>
    </div>

    <script>
        function togglePassword(id, btn) {
            const input = document.getElementById(id);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = 'HIDE';
            } else {
                input.type = 'password';
                btn.textContent = 'SHOW';
            }
        }

        document.getElementById('forgot-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('reset-alert');
            alertBox.style.display = 'none';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirm_password = document.getElementById('confirm_password').value;

            if (password !== confirm_password) {
                showToast("Passwords do not match.", "error");
                return;
            }

            if (password.length < 8) {
                showToast("Password must be at least 8 characters long.", "warning");
                return;
            }

            showLoader();
            try {
                const response = await fetch(`/api/forgot-password/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, confirm_password })
                });

                const data = await response.json();

                if (response.ok) {
                    showToast(data.message, "success");
                    // Redirect to login page after success as specifically requested
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 2000);
                } else {
                    showToast(data.error || "Failed to reset password.", "error");
                }
            } catch (err) {
                showToast("A network error occurred.", "error");
            } finally {
                hideLoader();
            }
        });
    </script>
</body>

</html>
