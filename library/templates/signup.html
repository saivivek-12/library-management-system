{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Library Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=10">
    <script src="{% static 'js/api.js' %}?v=7"></script>
    <script src="{% static 'js/auth.js' %}?v=7"></script>
    <style>
        .select-custom {
            cursor: pointer;
            appearance: none;
            background-image: url('data:image/svg+xml;charset=US-ASCII,<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="%2394a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>');
            background-repeat: no-repeat;
            background-position: right 0.75rem center;
            background-size: 16px;
        }
    </style>
</head>

<body>
    {% include 'nav.html' %}

    <div class="page-container" style="display:flex; justify-content:center; width:100%;">
        <div class="auth-card" style="margin-top: 2rem;">
            <div class="auth-header">
                <h1>Create an Account</h1>
                <p>Join Central Library Portal</p>
            </div>
            <div id="signup-alert" class="alert"></div>
            <form id="signup-form">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" class="form-control" required placeholder="Choose a username">
                </div>
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" class="form-control" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div style="position:relative;">
                        <input type="password" id="password" class="form-control" required
                            placeholder="Create a strong password">
                        <button type="button" onclick="togglePassword('password', this)"
                            style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text-muted); font-size: 0.75rem; font-weight: 600; cursor:pointer;">SHOW</button>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="name">Full Name</label>
                    <input type="text" id="name" class="form-control" required placeholder="Enter your full name">
                </div>
                <div class="form-group">
                    <label class="form-label" for="roll_no">Roll Number</label>
                    <input type="text" id="roll_no" class="form-control" required placeholder="e.g. STU001">
                </div>

                <div style="display:flex; gap:1rem;">
                    <div class="form-group" style="flex:1;">
                        <label class="form-label" for="department">Department</label>
                        <select id="department" class="form-control select-custom" required>
                            <option value="">Select Dept</option>
                            <option value="CSE">CSE</option>
                            <option value="ECE">ECE</option>
                            <option value="MECH">MECH</option>
                            <option value="CIVIL">CIVIL</option>
                            <option value="IT">IT</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label class="form-label" for="year">Year (Optional)</label>
                        <input type="number" id="year" class="form-control" placeholder="e.g. 1, 2, 3..." min="1"
                            max="4">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="phone">Phone Number (Optional)</label>
                    <input type="tel" id="phone" class="form-control" placeholder="Enter contact number">
                </div>
                <button type="submit" class="btn btn-primary"
                    style="width: 100%; margin-top: 1rem; padding: 0.75rem;">Sign Up</button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem;">
                <span style="color: var(--text-muted);">Already have an account?</span>
                <a href="/" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign in here</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Redirect if already logged in
            if (isAuthenticated()) {
                const role = getUserRole();
                if (role === 'admin') window.location.href = '/admin-dashboard/';
                else if (role === 'student') window.location.href = '/books/';
            }

            const signupForm = document.getElementById('signup-form');
            const alertBox = document.getElementById('signup-alert');
            const submitBtn = signupForm.querySelector('button[type="submit"]');

            signupForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                alertBox.style.display = 'none';

                const username = document.getElementById('username').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const name = document.getElementById('name').value.trim();
                const roll_no = document.getElementById('roll_no').value.trim();
                const department = document.getElementById('department').value;

                // Optional fields
                const yearRaw = document.getElementById('year').value;
                const phone = document.getElementById('phone').value.trim();

                const payload = { username, email, password, name, roll_no, department };
                if (yearRaw) payload.year = parseInt(yearRaw);
                if (phone) payload.phone = phone;

                submitBtn.disabled = true;
                submitBtn.textContent = 'Creating Account...';

                try {
                    // Register the student
                    const resp = await fetch('/api/signup/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    let errData = {};
                    try {
                        errData = await resp.json();
                    } catch (parseErr) {
                        errData = {};
                    }

                    if (!resp.ok) {
                        let errorMsg = errData.detail || 'Registration failed.';
                        if (!errData.detail && typeof errData === 'object') {
                            const errors = [];
                            for (const [key, value] of Object.entries(errData)) {
                                errors.push(`${key}: ${Array.isArray(value) ? value.join(', ') : value}`);
                            }
                            if (errors.length > 0) errorMsg = errors.join('<br>');
                        }
                        throw new Error(errorMsg);
                    }

                    // Show prominent success feedback
                    alertBox.innerHTML = `
                        <div style="font-weight: 700; font-size: 1rem; margin-bottom: 0.25rem;">✅ Account Created Successfully!</div>
                        <div>Welcome, <strong>${name}</strong>! Logging you into the Central Library...</div>
                    `;
                    alertBox.className = 'alert alert-success';
                    alertBox.style.display = 'block';
                    showToast('Account created successfully!', 'success');

                    // On success, auto-login
                    try {
                        const loginResp = await fetch('/api/token/', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ username, password })
                        });

                        if (loginResp.ok) {
                            const data = await loginResp.json();
                            sessionStorage.setItem('access_token', data.access);
                            sessionStorage.setItem('refresh_token', data.refresh);
                            sessionStorage.setItem('user_role', 'student');
                            setTimeout(() => {
                                window.location.href = '/books/';
                            }, 1200);
                            return;
                        }
                    } catch (loginErr) {
                        // ignore and redirect to sign in
                    }

                    // Fallback redirect to sign-in page
                    setTimeout(() => {
                        window.location.href = '/?registered=1';
                    }, 1800);

                } catch (err) {
                    alertBox.innerHTML = err.message || 'Registration failed.';
                    alertBox.className = 'alert alert-danger';
                    alertBox.style.display = 'block';
                    showToast(err.message || 'Registration failed.', 'error');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign Up';
                }
            });
        });

        function togglePassword(id, btn) {
            const input = document.getElementById(id);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = 'HIDE';
            } else {
                input.type = 'password';
                btn.textContent = 'SHOW';
            }
        }
    </script>
</body>

</html>
